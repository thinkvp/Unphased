name: Engine CI

# The shared DSP. Runs on Linux because it is pure Node — the only external
# dependency is ffmpeg, which a handful of tests use and skip themselves
# without. We install it so those tests actually run.

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'uxp/js/pairing.js'
      - 'uxp/js/volume.js'
      - 'testmedia/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'uxp/js/pairing.js'
      - 'uxp/js/volume.js'
      - 'testmedia/**'
      - '.github/workflows/engine-ci.yml'

defaults:
  run:
    working-directory: engine

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22+ only: `node --test "glob"` expands globs itself from Node 22.
        # On Node 20 (end-of-life since April 2026) the pattern is taken as a
        # literal path and every suite reports "could not find".
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The suite also covers uxp/js/pairing.js and uxp/js/volume.js, which are
      # panel modules the engine tests require directly — hence the extra paths
      # in the triggers above.
      #
      # UNPHASED_FFMPEG must be set: the suites default to the Windows install
      # path (C:\ffmpeg\bin\ffmpeg.exe) and silently skip when it is absent —
      # seven of the eighty-nine tests, including every job-protocol e2e.
      # A skip here is a silent coverage hole, not a pass: fail on one.
      - name: Unit tests
        env:
          UNPHASED_FFMPEG: /usr/bin/ffmpeg
        run: |
          set -o pipefail
          npm test 2>&1 | tee out.txt
          skipped="$(grep -oP '^. skipped \K\d+' out.txt | tail -1)"
          rm -f out.txt
          if [ "${skipped:-0}" != "0" ]; then
            echo "::error::$skipped test(s) skipped — ffmpeg is installed here, so nothing should skip."
            exit 1
          fi
