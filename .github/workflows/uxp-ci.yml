name: UXP CI

# Windows, because that is the only platform the UXP plugin ships for and the
# committed native addon is a Windows x64 binary — `npm run build` has to be
# able to stage it into the .ccx.
#
# Not covered here: uxp/tests/decodeCore.test.js, the bit-exactness checks on
# the native decoder. They drive native/build/decode_smoke, which needs the
# static FFmpeg libs under native/third_party/ — deliberately not committed —
# so those five tests skip in CI and must be run locally after building the
# addon. See uxp/native/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'uxp/**'
      - 'engine/src/**'
      - 'cep/js/pairing.js'
      - 'testmedia/**'
      - '.github/workflows/uxp-ci.yml'
  pull_request:
    paths:
      - 'uxp/**'
      - 'engine/src/**'
      - 'cep/js/pairing.js'
      - 'testmedia/**'
      - '.github/workflows/uxp-ci.yml'

defaults:
  run:
    working-directory: uxp

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 22+ only: `node --test "glob"` expands globs itself from Node 22.
        # On Node 20 (end-of-life since April 2026) the pattern is taken as a
        # literal path and every suite reports "could not find".
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Regenerates js/engine/* and js/pairing.js from the shared source and
      # fails if the committed copies have drifted, then parse-gates every file.
      - name: Lint (engine-transpile drift + syntax)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Native addon is present and committed
        shell: bash
        run: |
          test -f win/x64/unphased.uxpaddon || {
            echo "uxp/win/x64/unphased.uxpaddon is missing — it is committed on purpose."
            exit 1
          }
          echo "native addon ✓"

      - name: CEP <-> UXP version sync
        shell: bash
        run: |
          uxp_ver="$(node -p "require('./manifest.json').version")"
          cep_ver="$(tr -d '[:space:]' < ../cep/VERSION)"
          pkg_ver="$(node -p "require('./package.json').version")"
          if [ "$uxp_ver" != "$cep_ver" ] || [ "$uxp_ver" != "$pkg_ver" ]; then
            echo "Version mismatch — manifest.json=$uxp_ver package.json=$pkg_ver cep/VERSION=$cep_ver"
            echo "Bump them together: cd uxp && node scripts/set-version.js <version> --with-cep"
            exit 1
          fi
          echo "UXP & CEP both at $uxp_ver ✓"

      - name: Package check (.ccx builds)
        run: npm run build
