name: Release

# Push a tag like v0.3.0 to publish both plugins off one tag.
#
#   Unphased-UXP-<version>.ccx           Premiere 26+, Windows and macOS
#   Unphased-CEP-Setup-<version>.exe     Premiere 24/25, Windows
#
# No signing step: independent (non-Marketplace) .ccx distribution does not
# require Adobe Developer Distribution portal signing, and the CEP panel is
# installed by junction with PlayerDebugMode rather than as a signed ZXP.
#
# Two jobs. build-addon-mac compiles the universal macOS decode addon from
# source (it is not committed — it cannot be built on a Windows dev machine).
# release then packages the .ccx on Windows, bundling the pre-committed Windows
# addon and the macOS artifact together, so one .ccx installs on both.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build and attach to (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── macOS decode addon ───────────────────────────────────────────────────
  build-addon-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: uxp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Install build tools
        run: brew install nasm pkg-config cmake

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: uxp/ffmpeg-out
          # Same key as mac-native-ci.yml, so a release reuses the cache that
          # workflow already warmed rather than rebuilding FFmpeg from scratch.
          key: ffmpeg-mac-universal-8.1.2-${{ hashFiles('uxp/scripts/build-ffmpeg-mac.sh') }}

      - name: Build FFmpeg (static, universal, audio-only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ffmpeg.tar.xz https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          tar xf ffmpeg.tar.xz
          FFMPEG_SRC_DIR="$PWD/ffmpeg-8.1.2" PREFIX_BASE="$PWD/ffmpeg-out" \
            bash scripts/build-ffmpeg-mac.sh universal

      - name: Build the addon
        run: |
          cmake -S native -B native/build \
            -DFFMPEG_ROOT="$PWD/ffmpeg-out/universal" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build

      - name: Addon is universal and ad-hoc signed
        run: |
          addon=native/build/unphased.uxpaddon
          archs="$(lipo -archs "$addon")"
          echo "archs: $archs"
          for want in arm64 x86_64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::$addon is missing the $want slice (got: $archs)"; exit 1 ;;
            esac
          done
          codesign --verify --verbose "$addon"

      # The universal binary serves both architectures; it goes in both folders
      # because that is where build-ccx.js looks for them.
      - name: Stage for both mac architectures
        run: |
          mkdir -p mac/x64 mac/arm64
          cp native/build/unphased.uxpaddon mac/x64/
          cp native/build/unphased.uxpaddon mac/arm64/

      - name: Upload macOS addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-addon
          path: |
            uxp/mac/x64/unphased.uxpaddon
            uxp/mac/arm64/unphased.uxpaddon
          if-no-files-found: error

  # ── Package & publish ────────────────────────────────────────────────────
  release:
    needs: build-addon-mac
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the version in the tree
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          uxp_ver="$(node -p "require('./uxp/manifest.json').version")"
          cep_ver="$(tr -d '[:space:]' < cep/VERSION)"
          if [ "$tag" != "$uxp_ver" ] || [ "$tag" != "$cep_ver" ]; then
            echo "Tag $RELEASE_TAG != uxp/manifest.json ($uxp_ver) / cep/VERSION ($cep_ver)"
            exit 1
          fi
          echo "Releasing $uxp_ver ✓"

      - name: Download the macOS addon
        uses: actions/download-artifact@v4
        with:
          name: mac-addon
          # upload-artifact@v4 strips the common ancestor (uxp/mac/) from the
          # entry paths, so the artifact holds x64/... and arm64/.... Extract
          # into uxp/mac to restore the prefix build-ccx.js expects.
          path: uxp/mac

      - name: Both platform addons are present
        shell: bash
        run: |
          for f in uxp/mac/x64/unphased.uxpaddon uxp/mac/arm64/unphased.uxpaddon \
                   uxp/win/x64/unphased.uxpaddon; do
            test -f "$f" || { echo "::error::$f missing — the .ccx would not install on that platform"; exit 1; }
          done
          echo "win + mac addons ✓"

      - name: Lint, test, build the .ccx
        working-directory: uxp
        run: |
          npm run lint
          npm test
          npm run build

      # Read the finished package rather than trusting the build log: three
      # addon entries means it really is cross-platform, not a silently
      # Windows-only build that would install and then fail to decode on a Mac.
      - name: The .ccx carries all three addons
        shell: pwsh
        working-directory: uxp
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $ccx = (Get-ChildItem dist/*.ccx)[0].FullName
          $zip = [System.IO.Compression.ZipFile]::OpenRead($ccx)
          $found = $zip.Entries.FullName | Where-Object { $_ -like '*.uxpaddon' } | Sort-Object
          $zip.Dispose()
          $found | ForEach-Object { Write-Host "  $_" }
          $expected = @('mac/arm64/unphased.uxpaddon', 'mac/x64/unphased.uxpaddon', 'win/x64/unphased.uxpaddon')
          if (Compare-Object $found $expected) {
            Write-Host "::error::.ccx addon entries do not match win/x64 + mac/x64 + mac/arm64"
            exit 1
          }
          Write-Host "cross-platform .ccx ✓"

      - name: Engine tests
        working-directory: engine
        # No ffmpeg on the runner: the tests that need it skip themselves, and
        # engine-ci.yml covers them on Linux where we do install it.
        run: npm test

      # ── CEP installer ────────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # stage.js is the single include list: cep/ runtime files plus engine/
      # copied INSIDE the extension folder, which is what makes an installed
      # panel self-contained. See cep/scripts/stage.js.
      - name: Stage the CEP extension
        working-directory: cep
        run: node scripts/stage.js

      - name: Build the CEP installer
        shell: pwsh
        working-directory: cep
        run: |
          $version = (Get-Content VERSION).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\unphased-cep-installer.iss /DMyAppVersion=$version
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist/*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Creating a release in the GitHub UI also pushes the tag, which triggers
        # this workflow — so the release may already exist, with hand-written
        # notes. In that case just attach the assets.
        run: |
          assets=(uxp/dist/*.ccx cep/dist/*.exe)
          for a in "${assets[@]}"; do
            test -f "$a" || { echo "::error::release asset missing: $a"; exit 1; }
            echo "  $a"
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes --title "Unphased $RELEASE_TAG"
          fi
