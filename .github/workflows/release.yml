name: Release

# Push a tag like v0.3.0 to publish both plugins off one tag.
#
#   Unphased-UXP-<version>.ccx   double-click to install on Premiere 26+
#   Unphased-CEP-<version>.zip   cep/ + engine/, laid out for install-panel.ps1
#
# No signing step: independent (non-Marketplace) .ccx distribution does not
# require Adobe Developer Distribution portal signing, and the CEP panel is
# installed by junction with PlayerDebugMode rather than as a signed ZXP.
#
# The native decode addon is not built here — it is committed under
# uxp/win/x64/ on purpose. See uxp/native/README.md to rebuild it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build and attach to (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the version in the tree
        shell: bash
        run: |
          tag="${RELEASE_TAG#v}"
          uxp_ver="$(node -p "require('./uxp/manifest.json').version")"
          cep_ver="$(tr -d '[:space:]' < cep/VERSION)"
          if [ "$tag" != "$uxp_ver" ] || [ "$tag" != "$cep_ver" ]; then
            echo "Tag $RELEASE_TAG != uxp/manifest.json ($uxp_ver) / cep/VERSION ($cep_ver)"
            exit 1
          fi
          echo "Releasing $uxp_ver ✓"

      - name: Lint, test, build the .ccx
        working-directory: uxp
        run: |
          npm run lint
          npm test
          npm run build

      - name: Engine tests
        working-directory: engine
        # No ffmpeg on the runner: the tests that need it skip themselves, and
        # engine-ci.yml covers them on Linux where we do install it.
        run: npm test

      # The CEP panel runs from wherever it is extracted — install-panel.ps1
      # resolves cep/ relative to itself, and jobRunner.js finds ../engine/cli.js
      # next to it. So the bundle just has to preserve that pairing.
      - name: Build the CEP bundle
        shell: pwsh
        run: |
          $version = (Get-Content cep/VERSION).Trim()
          $stage = "dist-cep/Unphased-CEP-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item cep   $stage -Recurse -Exclude '.debug'
          Copy-Item engine $stage -Recurse
          Remove-Item "$stage/engine/test" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist-cep/Unphased-CEP-$version.zip" -Force
          Get-ChildItem dist-cep/*.zip | Select-Object Name, Length

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # Creating a release in the GitHub UI also pushes the tag, which triggers
        # this workflow — so the release may already exist, with hand-written
        # notes. In that case just attach the assets.
        run: |
          assets=(uxp/dist/*.ccx dist-cep/*.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --generate-notes --title "Unphased $RELEASE_TAG"
          fi
